<script>
'use strict';
const $=s=>document.querySelector(s);let lang='fr',route='home',view='years',quizStep=0,quizPick=null,quizRevealed=false,quizFinished=false,modal=null;const storageKey='memoryx-demo-v1';let state={trained:false,reminders:false,sound:false,aiAccepted:false,aiDismissed:false,helpSent:false,comments:[],requests:[],date:'',quiet:true};try{state={...state,...JSON.parse(localStorage.getItem(storageKey)||'{}')};lang=localStorage.getItem('memoryx-lang')||'fr'}catch(e){}const persist=()=>{try{localStorage.setItem(storageKey,JSON.stringify(state));localStorage.setItem('memoryx-lang',lang)}catch(e){}};const t=(fr,en)=>lang==='fr'?fr:en;const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icons={home:'◒',timeline:'↟',quiz:'✦',gap:'+',circle:'◎',ai:'✧',settings:'◷',map:'⤳'};
function art(type='coast'){const common='<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 360" preserveAspectRatio="xMidYMid slice">';const end='</svg>';if(type==='coast')return common+`<rect width="600" height="360" fill="#d9e9e9"/><circle cx="450" cy="80" r="44" fill="#f3d596"/><path d="M0 165Q130 155 265 178T600 160V360H0" fill="#82b8b1"/><path d="M0 220Q90 193 210 218T600 214V360H0" fill="#5f9f96"/><path d="M0 285Q145 230 278 274T600 258V360H0" fill="#e3cdae"/><path d="M0 322Q140 285 320 325T600 304V360H0" fill="#e9dabc"/><path d="M0 155L110 105 195 172Z" fill="#8d9e82"/><path d="M0 156L91 120 131 153 180 180 0 188Z" fill="#6e887a"/><path d="M290 193q70-13 130 0M70 236q70-12 120 0M405 246q80-11 150-3" fill="none" stroke="#cde3d8" stroke-width="3"/><path d="M210 275l22-13 25 10-5 7-40 4Z" fill="#b86d4f"/><path d="M232 262v-55l40 52Z" fill="#fbf4df"/><path d="M225 252v-35l-29 36Z" fill="#f5dbb8"/><path d="M482 305l9-16 4 21M498 313l7-21 6 16" stroke="#778a65" stroke-width="4" fill="none"/>`+end;if(type==='city')return common+`<rect width="600" height="360" fill="#f1ddd4"/><circle cx="110" cy="78" r="35" fill="#e8a57d"/><path d="M0 220l600-15v155H0" fill="#c7cab7"/><path d="M0 290l600-40v110H0" fill="#e7d7be"/><path d="M45 109l75-35 75 35v172H45" fill="#e5b184"/><path d="M45 109h150l-75-35Z" fill="#a96c57"/><path d="M211 128l75-36 75 36v135H211" fill="#b4c2ba"/><path d="M211 128h150l-75-36Z" fill="#657e75"/><path d="M375 85l80-31 90 31v165H375" fill="#dabd8c"/><path d="M375 85h170l-90-31Z" fill="#9c775e"/><g fill="#657d77"><path d="M70 145h25v40H70zM137 145h25v40h-25zM238 155h25v35h-25zM300 155h25v35h-25zM398 117h25v40h-25zM480 117h25v40h-25z"/><path d="M104 225q15-25 30 0v53h-30zM274 224q15-23 29 0v38h-29z"/></g><path d="M345 310q10-20 30 0" stroke="#456754" stroke-width="6" fill="none"/><circle cx="350" cy="317" r="13" fill="none" stroke="#456754" stroke-width="4"/><circle cx="390" cy="317" r="13" fill="none" stroke="#456754" stroke-width="4"/><path d="M350 317l20-22 20 22-30-2 10-20-6-8m6 8h12" stroke="#456754" stroke-width="4" fill="none"/>`+end;return common+`<rect width="600" height="360" fill="#dce2ca"/><circle cx="450" cy="60" r="40" fill="#f6e6af"/><path d="M0 240Q140 100 270 215T600 150V360H0" fill="#b0c29b"/><path d="M0 290Q160 170 330 264T600 213V360H0" fill="#6f9574"/><path d="M0 350Q220 260 600 315V360H0" fill="#486f58"/><path d="M235 360q90-65 30-104q-38-28 20-53" fill="none" stroke="#e6d7af" stroke-width="26"/><g fill="#3f6c54"><path d="M48 240l45-125 45 125zM100 265l55-155 55 155zM450 230l50-148 50 148z"/></g><g stroke="#355d49" stroke-width="9"><path d="M93 240v45M155 263v37M500 230v52"/></g><path d="M317 245l28-39 29 39" fill="#e9b287"/><path d="M320 245h56l-29-39Z" fill="#d87f60"/><path d="M338 245l10-21 11 21" fill="#6b624e"/>`+end}
const photo=(type,cls='')=>`<div class="photo ${cls}" role="img" aria-label="${t('Illustration de souvenir fictif','Illustration of a fictional memory')}">${art(type)}</div>`;
const navItems=[['home',()=>t('Aujourd’hui','Today')],['timeline',()=>t('Ma frise','My timeline')],['quiz',()=>t('Tester ma mémoire','Test my memory')],['gap',()=>t('Compléter mon histoire','Fill in my story')],['circle',()=>t('Mes proches','My circle')],['ai',()=>t('Mes pistes','My clues')]];
function chrome(){document.documentElement.lang=lang;$('#sidebar').innerHTML=`<div class="brand"><span class="brandmark"></span>MemoryX</div><nav class="nav" aria-label="${t('Navigation principale','Main navigation')}">${navItems.map(([r,l])=>`<button data-go="${r}" class="${route===r?'active':''}"><span class="ico" aria-hidden="true">${icons[r]}</span>${l()}</button>`).join('')}</nav><div class="sidefoot"><nav class="nav"><button data-go="settings" class="${route==='settings'?'active':''}"><span class="ico">◷</span>${t('Mon rythme','My rhythm')}</button></nav><div class="side-label">${t('ESPACE DÉMO','DEMO SPACE')}</div><div class="person"><span class="avatar">AL</span><div><strong class="small">Alex Laurent</strong><div class="muted small">${t('Compte de démo','Demo account')}</div></div></div></div>`;$('#topbar').innerHTML=`<div class="crumb">${t('Votre mémoire, vivante.','Your memory, alive.')}</div><div class="mobilebrand">MemoryX<span style="color:var(--coral)">·</span></div><div class="topactions"><span class="pill">◌ ${t('Démo interactive','Interactive demo')}</span><button class="lang" data-action="lang" aria-label="${t('Switch to English','Passer en français')}">${lang==='fr'?'FR / EN':'EN / FR'}</button><button class="iconbtn" data-go="settings" aria-label="${t('Mon rythme et notifications','My rhythm and notifications')}">◷</button><span class="avatar">AL</span></div>`;$('#bottomnav').innerHTML=[['home',()=>t('Aujourd’hui','Today')],['timeline',()=>t('Ma frise','Timeline')],['quiz',()=>t('Tester','Recall')],['gap',()=>t('Compléter','Fill in')],['circle',()=>t('Proches','Circle')]].map(([r,l])=>`<button data-go="${r}" class="${route===r?'active':''}"><span class="ico">${icons[r]}</span>${l()}</button>`).join('')}
const foot=()=>`<div class="footer-note"><button class="textbtn" data-action="aboutdemo">${t('Démo · données fictives','Demo · fictional data')}</button></div>`;
function head(title,sub='',action=''){return `<div class="pagehead"><div>${title}</h1><p class="sub">${sub}</p></div>${action}</div>`}
function home(){return head(`<h1>${t('Bonjour Alex.','Hello Alex.')}`,t('Quel souvenir revient aujourd’hui ?','What comes back today?'))+`<div class="game-choice"><button data-go="quiz"><span class="eyebrow">01</span><b>${t('Tester ma mémoire','Test my memory')} →</b><small>${t('Retrouver un souvenir déjà noté','Recall a memory already saved')}</small></button><button data-go="gap"><span class="eyebrow">02</span><b>${t('Compléter mon histoire','Fill in my story')} →</b><small>${t('Retrouver un morceau encore manquant','Rediscover a missing piece')}</small></button></div><div class="grid2"><section class="card hero"><div class="copy"><span class="eyebrow">${t('LE FLASH DU JOUR','TODAY’S FLASH')}</span><h2>${state.trained?t('Bien joué,<br>Alex.','Nice one,<br>Alex.'):t('Votre été<br>en Bretagne.','Your summer<br>in Brittany.')}</h2><p>${t('Le bateau, Léa… et ce petit port ?','The boat, Léa… and that little harbour?')}</p><button class="btn" data-action="startquiz">${state.trained?t('Rejouer','Play again'):t('Jouer · 2 min','Play · 2 min')} <span>→</span></button></div><div class="memory-orb"><div class="orb-ring"></div><div class="orbit-star">✳</div>${photo('coast')}<span class="orbit-label">${t('Été 2019 · ensemble','Summer 2019 · together')}</span></div></section><section class="card weekly"><div class="weekly-head"><h3>${t('Cette semaine','This week')}</h3><span class="flame">✦</span></div><div><p class="muted small" style="margin-top:13px">${t('Vos rendez-vous avec vos souvenirs.','Your moments with your memories.')}</p><div class="days">${['L','M','M','J','V','S','D'].map((d,i)=>`<div class="day ${i===0||i===2?'done':i===3?'today':''}">${lang==='en'?['M','T','W','T','F','S','S'][i]:d}<span>${i===0||i===2?'✓':i===3?'✦':'·'}</span></div>`).join('')}</div><div style="display:flex;justify-content:space-between;font-size:12px"><b>${state.trained?'3':'2'} ${t('moments cette semaine','moments this week')}</b><span class="muted">${t('objectif : 3','goal: 3')}</span></div><div class="progress"><i style="width:${state.trained?'100':'66'}%"></i></div></div><button class="textbtn" data-go="settings" style="align-self:flex-start">${t('Choisir mon rythme','Choose my rhythm')} →</button></section></div><div class="sectionrow"><h2>${t('À retrouver','Rediscover')}</h2><button class="textbtn" data-go="timeline">${t('Toute ma frise','My timeline')} →</button></div><div class="grid3">${memoryCard('coast',t('Ce fameux été','That unforgettable summer'),'2019',t('La côte, Léa et vous','The coast, Léa and you'),'detail')}${memoryCard('city',t('Un nouveau chapitre','A new chapter'),'2016',t('Les débuts à Lyon','The first days in Lyon'),'timeline')}${memoryCard('forest',t('La première escapade','The first little escape'),'2022',t('Un week-end au grand air','A weekend outdoors'),'timeline')}</div><div class="notice wide-note"><span class="floating-dot"></span><span>${t('Quel était ce port ?','Which harbour was it?')}</span><button class="textbtn" data-action="help">${t('Demander à Léa','Ask Léa')} →</button></div>`+foot()}
function memoryCard(type,title,year,desc,go){return `<button class="card memory-card" ${type==='coast'?`data-go="${go}"`:`data-action="sampledetail" data-memory="${type}"`}>${photo(type)}<div class="body"><span class="eyebrow muted">${year}</span><h3>${title}</h3><p class="small muted">${desc}</p><div class="meta"><span>◌ ${t('Ouvrir','Open')}</span><span>→</span></div></div></button>`}
function timeline(){let content='';if(view==='years')content=`<div class="timeline"><section class="era"><div class="era-label">2022 <span class="year-desc">${t('Prendre le large','Room to breathe')}</span></div>${timelineRow('forest',t('La première escapade','The first little escape'),t('Mai · un week-end dans les Cévennes','May · a weekend in the Cévennes'),'known')}</section><section class="era"><div class="era-label">2019 <span class="year-desc">${t('Un été à reconstituer','A summer to piece together')}</span></div>${timelineRow('coast',t('Ce fameux été','That unforgettable summer'),t('Été · côte bretonne · avec Léa','Summer · Brittany coast · with Léa'),'uncertain')}<div class="empty-memory"><div><h3>${t('Et entre ces deux moments ?','And between those moments?')}</h3><p class="small muted" style="margin-top:5px">${t('D’autres moments à retrouver','More moments to rediscover')}</p></div><button class="btn light small" data-go="gap">+ ${t('Compléter','Fill in')}</button></div></section><section class="era"><div class="era-label">2016 <span class="year-desc">${t('Changer de décor','A change of scene')}</span></div>${timelineRow('city',t('Mes débuts à Lyon','My first days in Lyon'),t('Septembre · mon premier appartement','September · my first apartment'),'known')}</section></div>`;if(view==='months')content=`<h2>2019 <span class="serif muted">${t('douze petits chapitres','twelve little chapters')}</span></h2><div class="monthgrid">${(lang==='fr'?['Janvier','Février','Mars','Avril','Mai','Juin','Juillet','Août','Septembre','Octobre','Novembre','Décembre']:['January','February','March','April','May','June','July','August','September','October','November','December']).map((m,i)=>`<button class="month ${i>=5&&i<=7?'highlight':''}" data-action="month" data-month="${i}"><strong>${m}</strong><span>${i>=5&&i<=7?t('Été : date non placée','Summer: date unplaced'):t('Une page à compléter','A page to fill')}</span>${i>=5&&i<=7?'<div class="tiny-dots">◌</div>':''}</button>`).join('')}</div><div class="notice">◌ ${t('Été 2019 · mois à retrouver','Summer 2019 · month unknown')}</div>`;if(view==='day')content=`<div class="card daydetail"><span class="pill orange">${t('Date à préciser','Date to refine')}</span><h2 style="margin-top:18px">${t('Un jour d’été, 2019','A summer day, 2019')}</h2><p class="muted small" style="margin:10px 0 20px">${t('Quel jour était-ce ?','What day was it?')}</p>${timelineRow('coast',t('Ce fameux été','That unforgettable summer'),t('Port breton · Léa · une traversée','Breton harbour · Léa · a crossing'),'uncertain')}<button class="btn light" data-action="help">${t('Retrouver la date ensemble','Find the date together')} →</button></div>`;return head(`<h1>${t('Ma frise','My timeline')}`,t('2016 — aujourd’hui','2016 — today'),`<button class="btn light" data-action="newmemory">+ ${t('Un souvenir','A memory')}</button>`)+`<div class="timeline-controls"><div class="tabs" role="tablist">${['years','months','day'].map(v=>`<button role="tab" aria-selected="${view===v}" class="${view===v?'active':''}" data-view="${v}">${({years:t('Années','Years'),months:t('Mois','Months'),day:t('Un jour','A day')})[v]}</button>`).join('')}</div><button class="textbtn" data-go="ai">✧ ${t('Enrichir ma frise','Enrich my timeline')}</button></div>${view==='years'?`<section class="life-layers"><span class="eyebrow muted">${t('MES CHAPITRES','MY CHAPTERS')}</span><div class="layer-track"><span>${t('Résidence','Home')}</span><div class="layer-bar">${t('Lyon · depuis 2016','Lyon · since 2016')}</div></div><div class="layer-track"><span>${t('Travail','Work')}</span><div class="layer-bar work">${t('Atelier créatif · 2018–2022','Creative studio · 2018–2022')}</div></div><div class="layer-track"><span>${t('Voyages','Travel')}</span><div class="layer-bar travel">${t('Bretagne · été 2019','Brittany · summer 2019')}</div></div></section>`:''}${(state.memories||[]).map(m=>`<div class="draft-memory"><span class="eyebrow muted">${m.origin==='gap'?t('AJOUTÉ À MA FRISE','ADDED TO MY TIMELINE'):t('BROUILLON','DRAFT')}</span><h3>${esc(m.title)}</h3><p class="small muted">${esc(m.when||t('Date encore ouverte','Date still open'))}</p>${m.origin==='gap'?`<span class="pill ${m.status==='recalled'?'green':'orange'}">${m.status==='recalled'?t('Confirmé par vous','Confirmed by you'):t('À confirmer','To confirm')}</span><p class="small muted">${esc(m.source||'')}</p>`:''}</div>`).join('')}${content}`+foot()}
function timelineRow(type,title,desc,status){return `<button class="era-row" ${type==='coast'?'data-go="detail"':`data-action="sampledetail" data-memory="${type}"`}>${photo(type)}<div><span class="eyebrow muted">${t('SOUVENIR PERSONNEL','PERSONAL MEMORY')}</span><h3>${title}</h3><p>${desc}</p></div><span class="pill ${status==='known'?'green':'orange'}">${status==='known'?t('Noté par moi','Noted by me'):t('À préciser','To refine')}</span></button>`}

function quiz(){if(quizFinished)return `<div class="quizwrap"><div class="card celebrate"><span class="eyebrow muted">${t('VOTRE PETITE PAUSE MÉMOIRE','YOUR LITTLE MEMORY BREAK')}</span><div class="flower">✳</div><h1>${t('À bientôt,<br>Alex.','See you soon,<br>Alex.')}</h1><p class="muted" style="margin-top:18px">${t('Vous avez revisité deux repères. Le port reste à retrouver.','You revisited two details. The harbour is still an open question.')}</p><div class="stat-pair"><div><strong>2</strong>${t('repères revisités','details revisited')}</div><div><strong>1</strong>${t('question ouverte','open question')}</div></div><div class="btnrow" style="justify-content:center"><button class="btn" data-action="help">${t('Un coup de main de Léa ?','A little help from Léa?')} →</button><button class="btn light" data-go="home">${t('C’est tout pour aujourd’hui','That’s enough for today')}</button></div></div></div>`+foot();const q=quizQs()[quizStep];return `<div class="quizwrap"><div class="quiztop"><button class="iconbtn" data-action="exitquiz" aria-label="${t('Quitter l’entraînement','Leave practice')}">×</button><div class="quiz-progress"><div class="progress"><i style="width:${quizStep/2*100}%"></i></div>${quizStep+1}/2</div><span class="pill">✦ ${t('Sans pression','No pressure')}</span></div><div class="quizcard"><div class="quizhead"><span class="eyebrow muted">${q.tag}</span><h1>${q.q}</h1><p class="small muted">${t('Un souvenir de votre été 2019','A memory from summer 2019')}</p></div>${photo('coast','quizart')}<div class="choices">${q.choices.map((c,i)=>`<button class="choice ${quizPick===i?'selected':''}" data-pick="${i}" ${quizRevealed?'disabled':''}><span class="key">${i+1}</span>${c}</button>`).join('')}</div>${quizRevealed?`<div class="feedback"><h3>${quizStep===2?t('Le doute a aussi sa place.','There’s room for doubt.'):quizPick===q.answer?t('Oui, ce détail était là.','Yes, that detail was there.'):t('On le retrouve ensemble.','Let’s rediscover it together.')}</h3> function renderModal(){if(!modal){$('#modalroot').innerHTML='';return}let title='',body='';if(modal==='aboutdemo'){title=t('À propos de cette démo','About this demo');body=`<p class="small muted">${t('Souvenirs et proches fictifs. IA, invitations, partage et notifications simulés : aucun envoi réel. Les essais restent dans ce navigateur.','Fictional memories and people. AI, invitations, sharing and notifications are simulated: nothing is sent. Demo changes stay in this browser.')}</p><p class="small muted" style="margin:15px 0">${t('Aucun bénéfice médical évalué. Ne saisissez pas de données personnelles réelles.','No medical benefit evaluated. Please do not enter real personal data.')}</p><button class="btn light" data-go="map">${t('Plan des écrans · revue','Screen map · review')} →</button>`}if(modal==='questionanswer'){title=t('Vérifier ce repère','Check this detail');body=`<p class="small muted">${t('Retrouvez la note utilisée pour cette question.','Review the note behind this question.')}</p><div class="notice">${t('Vos notes et les contributions de vos proches sont conservées séparément.','Your notes and your friends’ contributions are kept separately.')}</div><button class="btn" data-go="detail">${t('Relire le souvenir et ses sources','Review memory and sources')} →</button>`}if(modal==='recipient'){title=t('Ce que voit votre proche','What your friend sees');body=`<span class="pill blue">${t('APERÇU DESTINATAIRE · SIMULATION','RECIPIENT PREVIEW · SIMULATION')}</span><div class="inline-memory">${photo('coast')}<div><b>${t('Ce fameux été · 2019','That unforgettable summer · 2019')}</b><p>${t('Un seul souvenir partagé par Alex','One memory shared by Alex')}</p></div></div><p>${t('« Je me souviens du vent, du petit bateau… »','“I remember the wind, the little boat…”')}</p><form id="recipientform"><div class="field"><label for="recipientnote">${t('Un détail, une autre date ?','A detail, an alternative date?')}</label><textarea id="recipientnote" required maxlength="280"></textarea></div><button class="btn" type="submit">${t('Simuler une contribution','Simulate contribution')}</button></form><p class="small muted" style="margin-top:14px">${t('Pas d’accès à la frise entière. Aucun envoi.','No access to the full timeline. Nothing sent.')}</p>`}if(['citydetail','forestdetail'].includes(modal)){const city=modal==='citydetail';title=city?t('Mes débuts à Lyon','My first days in Lyon'):t('La première escapade','The first little escape');body=`${photo(city?'city':'forest')}<div class="notice" style="margin-top:18px">${city?t('Septembre 2016 · Lyon','September 2016 · Lyon'):t('Mai 2022 · Cévennes','May 2022 · Cévennes')}</div><p style="margin:20px 0">${city?t('« Les cartons étaient partout. Je me souviens du vélo dans l’entrée et du premier café au coin de la rue. »','“Boxes everywhere. I remember the bicycle in the hallway and my first coffee on the corner.”'):t('« Une petite tente, un grand ciel. On avait pris le mauvais sentier, puis trouvé une clairière. »','“A little tent, a big sky. We took the wrong path, then found a clearing.”')}</p><span class="pill green">${t('Repère noté par Alex · fictif','Detail noted by Alex · fictional')}</span><p class="small muted" style="margin-top:12px">${t('Jour à préciser · illustration','Day unknown · illustration')}</p>`}if(modal==='help'){title=t('Un coup de main ?','A little help?');body=`<p class="small muted">${t('Partagez seulement ce souvenir avec les proches choisis.','Share only this memory with the people you choose.')}</p><div class="inline-memory">${photo('coast')}<div><b class="small">${t('Ce fameux été · 2019','That unforgettable summer · 2019')}</b><p>${t('Date et lieu à préciser','Date and place to refine')}</p></div></div><form id="helpform"><div class="field"><label for="helptext">${t('Votre question','Your question')}</label><textarea id="helptext" maxlength="400" required>${t('Tu te rappelles du nom de ce petit port ? Et de la date ?','Do you remember the name of that little harbour? And when it was?')}</textarea></div><p class="small" style="margin-bottom:9px">${t('Avec qui ?','With whom?')}</p><div class="checks">${['Léa','Max','Camille'].map((n,i)=>`<label class="check-person"><input type="checkbox" name="person" value="${n}" ${i===0?'checked':''}>${n}</label>`).join('')}</div><div class="notice" style="font-size:10px;margin-bottom:18px">${t('Simulation uniquement : aucun lien ni message n’est envoyé.','Simulation only: no link or message will be sent.')}</div><button class="btn" type="submit">${t('Simuler la demande','Simulate request')} →</button></form>`}if(modal==='share'){title=t('Partager ce souvenir','Share this memory');body=`<p class="small muted">${t('Choisissez qui peut voir ce souvenir.','Choose who can see this memory.')}</p><div class="inline-memory">${photo('coast')}<div><b class="small">${t('Ce fameux été · 2019','That unforgettable summer · 2019')}</b><p>${t('Image, titre et votre note. Pas les autres souvenirs.','Image, title and your note. No other memories.')}</p></div></div><div class="field"><label>${t('Accès','Access')}</label><select><option>${t('Personnes choisies uniquement','Chosen people only')}</option></select></div><button class="btn" data-action="previewshare">${t('Voir l’aperçu du proche','See the recipient preview')} →</button><p class="small muted" style="margin-top:14px">${t('Aucun lien public créé.','No public link created.')}</p>`}if(modal==='invite'){title=t('Inviter un proche','Invite someone close');body=`<p>${t('« Je reconstruis quelques souvenirs. Tu m’aides à retrouver un détail ? »','“I’m piecing together a few memories. Will you help me remember a detail?”')}</p><p class="small muted" style="margin:18px 0">${t('Souvenir joint : Ce fameux été · 2019','Attached memory: That unforgettable summer · 2019')}</p><button class="btn" data-action="invitepreview">${t('Simuler l’invitation','Simulate invitation')}</button><p class="small muted" style="margin-top:15px">${t('Démonstration : aucun destinataire réel.','Demonstration: no real recipient.')}</p>`}if(modal==='editdate'){title=t('Modifier la date','Edit date');body=`<form id="dateform"><p class="small muted">${t('Ex. : été 2019, août 2019 ou 12 août 2019.','E.g. summer 2019, August 2019 or 12 August 2019.')}</p><div class="field"><label for="datetext">${t('Quand était-ce ?','When was it?')}</label><input id="datetext" value="${esc(state.date||t('Été 2019','Summer 2019'))}" maxlength="60" required></div><button class="btn" type="submit">${t('Garder cette précision','Keep this detail')}</button></form>`}if(modal==='newmemory'){title=t('Ajouter un souvenir','Add a memory');body=`<form id="newmemoryform"><div class="field"><label for="newtitle">${t('Un titre, quelques mots','A title, a few words')}</label><input id="newtitle" maxlength="80" placeholder="${t('Ce dîner qui a duré des heures…','That dinner that went on for hours…')}" required></div><div class="field"><label for="newwhen">${t('Quand, même approximativement','When, even approximately')}</label><input id="newwhen" maxlength="60" placeholder="${t('Vers 2015, un hiver','Around 2015, one winter')}"></div><p class="small muted" style="margin-bottom:18px">${t('Brouillon local de démonstration. Évitez les informations personnelles réelles.','Local demo draft. Please avoid real personal information.')}</p><button class="btn" type="submit">${t('Créer le brouillon','Create draft')}</button></form>`}if(modal==='reset'){title=t('Revenir au début ?','Back to the beginning?');body=`<p class="muted small" style="margin-bottom:20px">${t('Efface uniquement les essais enregistrés dans cette maquette sur ce navigateur.','Only clears demo interactions saved in this browser.')}</p><button class="btn" data-action="confirmreset">${t('Oui, réinitialiser la démo','Yes, reset the demo')}</button>`}if(modal==='exitquiz'){title=t('On reprend plus tard ?','Pick this up later?');body=`<p class="muted small" style="margin-bottom:20px">${t('Votre souvenir reste dans votre frise.','Your memory stays in your timeline.')}</p><div class="btnrow"><button class="btn" data-action="leavequiz">${t('Quitter doucement','Leave for now')}</button><button class="btn light" data-action="close">${t('Continuer','Continue')}</button></div>`}$('#modalroot').innerHTML=`<div class="modalback" data-action="backdrop"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="modaltitle"><div class="modalhead"><h2 id="modaltitle">${title}</h2><button class="iconbtn" data-action="close" aria-label="${t('Fermer','Close')}">×</button></div>${body}</section></div>`}
document.addEventListener('click',e=>{const b=e.target.closest('button,[data-action="backdrop"]');if(!b)return;if(b.dataset.go){closeModal();go(b.dataset.go);return}if(b.dataset.view){view=b.dataset.view;render();return}if(b.dataset.pick!==undefined){quizPick=Number(b.dataset.pick);render();return}if(b.dataset.toggle){if(route==='settings'){state.time=$('#time').value;state.cadence=$('#cadence').selectedIndex;}state[b.dataset.toggle]=!state[b.dataset.toggle];persist();render();return}const a=b.dataset.action;if(a==='lang'){lang=lang==='fr'?'en':'fr';persist();render()}if(a==='sampledetail')showModal(b.dataset.memory==='city'?'citydetail':'forestdetail');if(a==='startquiz'){go('quiz')}if(a==='checkquiz'){quizRevealed=true;render()}if(a==='skip'){quizPick=-1;quizRevealed=true;render()}if(a==='nextquiz'){if(quizStep<1){quizStep++;quizPick=null;quizRevealed=false}else{quizFinished=true;state.trained=true;persist()}render()}if(a==='aboutdemo')showModal('aboutdemo');if(a==='questionanswer')showModal('questionanswer');if(a==='hint')toast(quizQs()[quizStep].hint);if(['help','share','invite','editdate','newmemory','reset','exitquiz'].includes(a))showModal(a);if(a==='close')closeModal();if(a==='backdrop'&&e.target===b)closeModal();if(a==='leavequiz'){closeModal();go('home')}if(a==='month'){if(['5','6','7'].includes(b.dataset.month)){view='day';render()}else toast(t('Pas encore de souvenir pour ce mois. Ajoutez un premier indice.','No memory for this month yet. Add a first clue.'))}if(a==='analyze')toast(t('Analyse simulée terminée : 1 hypothèse et 1 repère personnel à relire.','Simulated analysis complete: 1 hypothesis and 1 personal detail to review.'));if(a==='acceptai'){state.aiAccepted=true;state.aiDismissed=false;persist();render();toast(t('Piste conservée, toujours marquée « à confirmer ».','Clue kept, still marked “to confirm”.'))}if(a==='dismissai'){state.aiDismissed=true;state.aiAccepted=false;persist();render()}if(a==='undoai'){state.aiDismissed=false;state.aiAccepted=false;persist();render()}if(a==='saveprefs'){state.cadence=$('#cadence').selectedIndex;state.time=$('#time').value;persist();render();toast(t('Préférences de démo conservées. Aucun push activé sur cet appareil.','Demo preferences saved. No device push notifications enabled.'))}if(a==='previewshare'||a==='invitepreview'){showModal('recipient')}if(a==='confirmreset'){state={trained:false,reminders:false,sound:false,aiAccepted:false,aiDismissed:false,helpSent:false,comments:[],requests:[],date:'',quiet:true};persist();closeModal();go('home');toast(t('La démo est revenue au début.','The demo is back at the beginning.'))}});
document.addEventListener('submit',e=>{e.preventDefault();if(e.target.id==='recipientform'){state.comments.push(t('Contribution proche simulée : ','Simulated friend contribution: ')+$('#recipientnote').value.trim());persist();closeModal();go('circle')}if(e.target.id==='commentform'){const v=new FormData(e.target).get('comment').trim();if(v){state.comments.push(v);persist();render();toast(t('Commentaire enregistré dans la démo uniquement.','Comment saved in the demo only.'))}}if(e.target.id==='helpform'){if(!e.target.querySelector('input:checked')){toast(t('Choisissez au moins un proche fictif.','Choose at least one fictional person.'));return}state.helpSent=true;state.requests.push({text:$('#helptext').value.trim(),people:[...e.target.querySelectorAll('input:checked')].map(x=>x.value)});persist();closeModal();go('circle');toast(t('Demande simulée. Aucun message envoyé.','Request simulated. No message sent.'))}if(e.target.id==='dateform'){state.date=$('#datetext').value.trim();persist();closeModal();render();toast(t('Date enregistrée','Date saved'))}if(e.target.id==='newmemoryform'){state.memories=state.memories||[];state.memories.push({title:$('#newtitle').value.trim(),when:$('#newwhen').value.trim()});persist();closeModal();go('timeline');toast(t('Brouillon local créé dans vos essais.','Local draft created in your demo.'))}});
function gapState(){return state.gap||(state.gap={step:'setup',grain:'month',category:'any',text:'',precision:'',certainty:'hypothesis',branch:'',confirmed:false})}
const gapCats=()=>({work:t('Travail','Work'),life:t('Vie quotidienne','Everyday life'),places:t('Lieux','Places')});
function gapPrompt(g){return ({work:t('Sur quoi travailliez-vous ?','What were you working on?'),life:t('Quel moment vous revient ?','What moment comes back?'),places:t('Où passiez-vous vos journées ?','Where did you spend your days?')})[g.drawCategory]||t('Que vous revient-il ?','What comes back?')}
function gapPeriod(g){return (g.grain==='year'?'2017':g.grain==='month'?t('Septembre 2017','September 2017'):t('18 septembre 2017','18 September 2017')).replaceAll('2017',String(g.year||2017))}
function gap(){const g=gapState(),period=gapPeriod(g),cats=gapCats();let body='';const act=(id,label,light=false)=>`<button class="btn ${light?'light':''}" data-gap="${id}">${label}</button>`;
if(g.step==='setup')body=`<span class="eyebrow">${t('COMPLÉTER MON HISTOIRE','FILL IN MY STORY')}</span><h1>${t('Un morceau<br>à retrouver.','A missing piece<br>to rediscover.')}</h1><div class="field"><label>${t('À quelle échelle ?','How much detail?')}</label><div class="gap-grains">${['year','month','day'].map(k=>`<button class="choice ${g.grain===k?'selected':''}" data-grain="${k}">${({year:t('Une année','A year'),month:t('Un mois','A month'),day:t('Un jour','A day')})[k]}</button>`).join('')}</div></div><div class="field"><label for="gapcategory">${t('Un thème','A theme')}</label><select id="gapcategory" data-gapfield="category"><option value="any" ${g.category==='any'?'selected':''}>${t('Surprenez-moi','Surprise me')}</option>${Object.entries(cats).map(([k,v])=>`<option value="${k}" ${g.category===k?'selected':''}>${v}</option>`).join('')}</select></div><p class="small muted">${t('Une période passée à explorer.','A past period to explore.')}</p><div class="btnrow">${act('draw',t('Tirer une période','Draw a period'))}</div>`;
if(g.step==='choose')body=`<span class="pill orange">${cats[g.drawCategory]}</span><h1>${period}</h1><h2>${gapPrompt(g)}</h2><p class="muted">${t('Un lieu, un visage, un détail…','A place, a face, a detail…')}</p><div class="gap-branches">${act('remember',t('Je me souviens','I remember'))}${act('ai',t('Chercher des indices IA','Look for AI clues'),true)}${act('friend',t('Demander à un ami','Ask a friend'),true)}</div><p class="small muted">${t('Pas de réponse attendue.','No expected answer.')}</p>${act('setup',t('Changer de période','Change period'),true)}`;
if(g.step==='remember')body=`<span class="eyebrow">${period} · ${cats[g.drawCategory]}</span><h1>${gapPrompt(g)}</h1><form id="gapremember"><div class="field"><label for="gaptext">${t('Ce qui vous revient','What you remember')}</label><textarea id="gaptext" data-gapfield="text" required maxlength="600" placeholder="${t('Je crois que… J’étais avec…','I think… I was with…')}">${esc(g.text)}</textarea></div><p class="small muted">${t('Qui était là ? Où étiez-vous ? Une image ou une sensation ?','Who was there? Where were you? An image or a feeling?')}</p><button class="btn" type="submit">${t('Continuer','Continue')} →</button></form>`;
if(g.step==='ai')body=`<span class="pill blue">${t('IA simulée · sources fictives','Simulated AI · fictional sources')}</span><h1>${t('Chercher une piste','Find a clue')}</h1><p>${period} · ${cats[g.drawCategory]}</p><div class="gap-sources">${['Gmail','Calendrier','WhatsApp'].map(n=>`<span class="pill">${n==='Calendrier'?t('Calendrier','Calendar'):n}</span>`).join('')}</div><p class="small muted">${t('Aucun compte connecté. Aucun message réel lu.','No accounts connected. No real messages read.')}</p><div class="btnrow">${act('search',t('Lancer la recherche simulée','Run simulated search'))}</div>`;
if(g.step==='clues')body=`<span class="pill blue">${t('3 indices fictifs · à vérifier','3 fictional clues · to review')}</span><h1>${t('Cela vous dit quelque chose ?','Does this ring a bell?')}</h1><div class="gap-clues">${gapClues(g).map((c,i)=>`<label class="gap-clue"><input type="radio" name="gapclue" value="${i}" ${g.clue===i?'checked':''}><span><b>${c.source}</b><small>${c.date} · ${t('fictif','fictional')}</small><p>${c.text}</p></span></label>`).join('')}</div><div class="btnrow">${act('useclue',t('Revoir cet indice','Review this clue'))}${act('choose',t('Rien ne me revient','Nothing comes back'),true)}</div>`;
if(g.step==='friend')body=`<span class="eyebrow">${period}</span><h1>${t('Qui pourrait se rappeler ?','Who might remember?')}</h1><div class="field"><label for="gapfriend">${t('Votre proche','Your friend')}</label><select id="gapfriend"><option>Paul · ${t('contact fictif','fictional contact')}</option></select></div><div class="field"><label for="gapmessage">${t('Votre message','Your message')}</label><textarea id="gapmessage" data-gapfield="message" maxlength="500">${esc(g.message||gapMessage(g))}</textarea></div><p class="small muted">${t('Seuls la période, le thème et ce message seront dans l’aperçu.','The preview contains only the period, theme and this message.')}</p>${act('friendpreview',t('Prévisualiser','Preview'))}`;
if(g.step==='friendpreview')body=`<span class="pill blue">${t('Aperçu · aucun envoi réel','Preview · no real delivery')}</span><h1>${t('À Paul','To Paul')}</h1><blockquote class="gap-quote">${esc(g.message||gapMessage(g))}</blockquote><p class="small muted">${t('Paul ne voit pas votre frise.','Paul does not see your timeline.')}</p><div class="btnrow">${act('friendsend',t('Simuler l’envoi et la réponse','Simulate send and reply'))}${act('friend',t('Modifier','Edit'),true)}</div>`;
if(g.step==='friendreply')body=`<span class="pill blue">${t('Réponse fictive de Paul','Fictional reply from Paul')}</span><h1>${t('« Il me semble que… »','“I think…”')}</h1><blockquote class="gap-quote">${gapFriendReply(g)}</blockquote><p class="small muted">${t('Paul hésite sur la date.','Paul is unsure about the date.')}</p><div class="btnrow">${act('usefriend',t('Revoir ce souvenir','Review this memory'))}${act('choose',t('Chercher autrement','Try another way'),true)}</div>`;
if(g.step==='review')body=`<span class="pill">${g.branch==='remember'?t('Votre souvenir','Your memory'):g.branch==='ai'?t('Indice IA · fictif','AI clue · fictional'):t('Souvenir de Paul · fictif','Paul’s recollection · fictional')}</span><h1>${t('Ce que vous gardez','What you want to keep')}</h1><form id="gapreview"><div class="field"><label for="gapreviewtext">${t('Le souvenir','The memory')}</label><textarea id="gapreviewtext" data-gapfield="text" required maxlength="600">${esc(g.text)}</textarea></div><div class="field"><label for="gapprecision">${t('Quand ? Même approximativement.','When? Approximate is fine.')}</label><input id="gapprecision" data-gapfield="precision" required maxlength="80" value="${esc(g.precision||period)}"></div><div class="field"><label for="gapcertainty">${t('Votre degré de certitude','How certain are you?')}</label><select id="gapcertainty" data-gapfield="certainty"><option value="hypothesis" ${g.certainty==='hypothesis'?'selected':''}>${t('Une piste à confirmer','A clue to confirm')}</option><option value="recalled" ${g.certainty==='recalled'?'selected':''}>${t('Je confirme m’en souvenir','I confirm I remember it')}</option></select></div><div class="gap-source-note">${esc(g.source||t('Votre récit','Your account'))}</div><label class="gap-confirm"><input type="checkbox" id="gapconfirm" required> ${t('Je valide ce texte et ce niveau de certitude.','I approve this text and level of certainty.')}</label><button class="btn" type="submit">${t('Ajouter à ma frise','Add to my timeline')} →</button></form>`;
if(g.step==='result')body=`<span class="eyebrow">${t('AJOUTÉ À VOTRE FRISE','ADDED TO YOUR TIMELINE')}</span><div class="gap-spark">✳</div><h1>${g.saved?.status==='recalled'?t('Un souvenir retrouvé.','A memory rediscovered.'):t('Une nouvelle piste.','A new clue.')}</h1><span class="pill ${g.saved?.status==='recalled'?'green':'orange'}">${g.saved?.status==='recalled'?t('Confirmé par vous','Confirmed by you'):t('À confirmer','To confirm')}</span><blockquote class="gap-quote">${esc(g.saved?.title||'')}</blockquote><p class="small muted">${esc(g.saved?.when||'')} · ${t('Privé','Private')}</p><div class="btnrow"><button class="btn" data-go="timeline">${t('Voir ma frise','View my timeline')}</button>${act('share',t('Partager ce souvenir','Share this memory'),true)}</div>${act('restart',t('Un autre morceau ?','Another piece?'),true)}`;
if(g.step==='share')body=`<span class="pill blue">${t('Partage optionnel · aperçu','Optional sharing · preview')}</span><h1>${t('Juste ce souvenir','Just this memory')}</h1><div class="field"><label>${t('Avec qui ?','With whom?')}</label><select><option>Paul · ${t('contact fictif','fictional contact')}</option></select></div><blockquote class="gap-quote">${esc(g.saved?.title||'')}</blockquote><p>${esc(g.saved?.when||'')} · ${g.saved?.status==='recalled'?t('Confirmé par vous','Confirmed by you'):t('À confirmer','To confirm')}</p><p class="small muted">${t('La frise et les documents sources restent privés. Aucun lien public.','Your timeline and source documents stay private. No public link.')}</p><div class="btnrow">${act('sharesim',t('Simuler le partage à Paul','Simulate sharing with Paul'))}${act('result',t('Garder pour moi','Keep private'),true)}</div>${g.shared?`<div class="notice">${t('Aperçu enregistré. Aucun message envoyé.','Preview saved. No message sent.')}</div>`:''}`;
return `<section class="gap-wrap"><div class="gap-top">${g.step==='setup'?'<button class="textbtn" data-go="home">← '+t('Mes jeux','My games')+'</button>':act('back','← '+t('Retour','Back'),true)}<span class="small muted">${t('Compléter mon histoire','Fill in my story')}</span></div><div class="gap-card">${body}</div></section>`+foot()}
function gapMessage(g){return t('Salut Paul, tu te rappelles de cette période : ','Hi Paul, do you remember this period: ')+gapPeriod(g)+' ? '+({work:t('Tu sais sur quoi je travaillais ?','Do you remember what I was working on?'),life:t('Un moment ensemble te revient ?','Do you recall a moment we shared?'),places:t('Tu sais où je passais mes journées ?','Do you remember where I spent my days?')})[g.drawCategory]}
function gapClues(g){const cat=g.drawCategory;return [{source:'Gmail',date:'14/09/'+(g.year||2017),text:cat==='work'?t('« On prépare l’atelier de vendredi à Lyon ? »','“Shall we prepare Friday’s workshop in Lyon?”'):cat==='places'?t('« On se retrouve au café des Terreaux ? »','“Shall we meet at the café on Place des Terreaux?”'):t('« Dîner chez Paul ce week-end ? »','“Dinner at Paul’s this weekend?”')},{source:t('Calendrier','Calendar'),date:'18/09/'+(g.year||2017),text:t('« Café avec Paul · Lyon » — rendez-vous noté, présence non confirmée.','“Coffee with Paul · Lyon” — scheduled, attendance unconfirmed.')},{source:'WhatsApp',date:'19/09/'+(g.year||2017),text:t('Paul : « Content de t’avoir croisé hier ! » — lieu non précisé.','Paul: “Nice running into you yesterday!” — location unspecified.')} ]}
function gapFriendReply(g){return t('« Je crois qu’on avait pris un café à Lyon, vers la rentrée 2017. Peut-être aux Terreaux ? Je ne sais plus quel jour. »','“I think we had coffee in Lyon around September 2017. Maybe Place des Terreaux? I can’t remember which day.”').replaceAll('2017',String(g.year||2017))}
function gapNavigate(step){const g=gapState();g.step=step;persist();render();window.scrollTo({top:0,behavior:'instant'})}
document.addEventListener('input',e=>{if(e.target.dataset.gapfield){gapState()[e.target.dataset.gapfield]=e.target.value;persist()}});
document.addEventListener('change',e=>{if(e.target.dataset.gapfield){gapState()[e.target.dataset.gapfield]=e.target.value;persist()}if(e.target.name==='gapclue'){gapState().clue=Number(e.target.value);persist()}});
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;const g=gapState();if(b.dataset.grain){g.grain=b.dataset.grain;persist();render();return}const a=b.dataset.gap;if(!a)return;if(a==='draw'){g.year=[2017,2018,2020][Math.floor(Math.random()*3)];g.drawCategory=g.category==='any'?['work','life','places'][Math.floor(Math.random()*3)]:g.category;g.text='';g.precision='';g.branch='';g.source='';g.certainty='hypothesis';g.clue=null;g.message='';g.shared=false;gapNavigate('choose')}else if(a==='remember'){g.branch='remember';g.source=t('Votre récit','Your account');gapNavigate('remember')}else if(a==='search')gapNavigate('clues');else if(a==='useclue'){if(g.clue===null||g.clue===undefined){toast(t('Choisissez un indice.','Choose a clue.'));return}const c=gapClues(g)[g.clue];g.branch='ai';g.source=c.source+' · '+c.date+' · '+t('source fictive','fictional source');g.text=c.text;g.precision=c.date;g.certainty='hypothesis';gapNavigate('review')}else if(a==='friendsend')gapNavigate('friendreply');else if(a==='usefriend'){g.branch='friend';g.source=t('Paul · réponse fictive · date incertaine','Paul · fictional reply · uncertain date');g.text=gapFriendReply(g);g.precision=t('Vers septembre ','Around September ')+(g.year||2017);g.certainty='hypothesis';gapNavigate('review')}else if(a==='back'){gapNavigate(({choose:'setup',remember:'choose',ai:'choose',clues:'ai',friend:'choose',friendpreview:'friend',friendreply:'friendpreview',review:g.branch==='remember'?'remember':g.branch==='ai'?'clues':'friendreply',result:'setup',share:'result'})[g.step]||'setup')}else if(a==='restart'){state.gap={step:'setup',grain:g.grain,category:'any',text:'',precision:'',certainty:'hypothesis'};persist();render()}else if(a==='sharesim'){g.shared=true;persist();render()}else gapNavigate(a)});
document.addEventListener('submit',e=>{if(e.target.id==='gapremember'){e.preventDefault();const g=gapState();g.text=$('#gaptext').value.trim();if(!g.text)return;g.precision=g.precision||gapPeriod(g);gapNavigate('review')}if(e.target.id==='gapreview'){e.preventDefault();if(!$('#gapconfirm').checked)return;const g=gapState();const text=$('#gapreviewtext').value.trim(),when=$('#gapprecision').value.trim();if(!text||!when)return;g.saved={id:Date.now(),title:text,when,status:$('#gapcertainty').value,source:g.source,origin:'gap'};state.memories=state.memories||[];state.memories.push({...g.saved});g.shared=false;gapNavigate('result')}});

document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal)closeModal();if(modal&&e.key==='Tab'){const f=[...$('#modalroot').querySelectorAll('button,input,textarea,select')];if(e.shiftKey&&document.activeElement===f[0]){e.preventDefault();f.at(-1).focus()}else if(!e.shiftKey&&document.activeElement===f.at(-1)){e.preventDefault();f[0].focus()}}});window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['home','timeline','detail','quiz','circle','ai','settings','map','gap'].includes(h)&&h!==route){route=h;closeModal();render()}});route=['home','timeline','detail','quiz','circle','ai','settings','map','gap'].includes(location.hash.slice(1))?location.hash.slice(1):'home';render();
</script></body></html>
