name: Deploy MemoryX demo
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: memoryx-pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate demo and stage public files only
        run: |
          node -e "const fs=require('fs');const s=fs.readFileSync('index.html','utf8');for(const m of s.matchAll(/<script[^>]*>([\\s\\S]*?)<\\/script>/g))new Function(m[1]);console.log('JavaScript parse OK')"
          node tests/mixed-session.test.cjs
          mkdir -p _site/tests
          cp index.html _site/index.html
          cp tests/responsive.html _site/tests/responsive.html
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
